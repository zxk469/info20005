<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - HereBags</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1 class="logo">HereBags</h1>
    <nav>
        <a href="website.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        <a href="website.html#about">About</a>
        <a href="website.html#contact">Contact</a>
    </nav>
</header>

<section class="shop">
    <h2>Our Collection</h2>
    <div class="product-grid">
        <div class="product"> 
            <a href="product.html?product=clementine">
                <img id="clementine-img" src="https://www.thehorse.com.au/cdn/shop/files/CLEM_00010.jpg?v=1773890590&width=1200" alt="Clementine Bag">
            </a>
           
            <div class="slider-buttons">
                <button onclick="changeImage('clementine-img', clementineImages, -1)">Previous</button>
                <button onclick="changeImage('clementine-img', clementineImages, 1)">Next</button>
            </div>

            <h3>Clementine Bag</h3>
            <p>$299</p>
            <button onclick="addToCart('Clementine Bag', 299)">Add to Cart</button>
        </div>

        <div class="product">
            <a href="product.html?product=fin">
                <img id="fin-img" src="https://www.thehorse.com.au/cdn/shop/files/Untitleddesign_37.png?v=1773190538&width=1200" alt="Fin Drawstring Bag">
            </a>

            <div class="slider-buttons">
                <button onclick="changeImage('fin-img', finImages, -1)">Previous</button>
                <button onclick="changeImage('fin-img', finImages, 1)">Next</button>
            </div>

            <h3>Fin Drawstring Bag</h3>
            <p>$159</p>
            <button onclick="addToCart('Fin Drawstring Bag', 159)">Add to Cart</button>
        </div>

        <div class="product">
            <a href="product.html?product=tilly">
                <img id="tilly-img" src="https://www.thehorse.com.au/cdn/shop/files/TillyCoffeeTSB3_5.jpg?v=1770684332&width=1200" alt="Tilly Bag">
            </a>

            <div class="slider-buttons">
                <button onclick="changeImage('tilly-img', tillyImages, -1)">Previous</button>
                <button onclick="changeImage('tilly-img', tillyImages, 1)">Next</button>
            </div>

            <h3>Tilly Bag</h3>
            <p>$299</p>
            <button onclick="addToCart('Tilly Bag', 299)">Add to Cart</button>
        </div> 

        <div class="product">
            <a href="product.html?product=esme">
                <img id="esme-img" src="https://www.thehorse.com.au/cdn/shop/files/EsmeToteBlackESM1_1.jpg?v=1770684953&width=1200" alt="Esme Bag">
            </a>
            
            <div class="slider-buttons">
                <button onclick="changeImage('esme-img', esmeImages, -1)">Previous</button>
                <button onclick="changeImage('esme-img', esmeImages, 1)">Next</button>
            </div>
            
            <h3>Esme Bag</h3>
            <p>$249</p>
            <button onclick="addToCart('Esme Bag', 249)">Add to Cart</button>
        </div>
    </div>
</section>

<script src="script.js"></script>
    
</body>
</html>
