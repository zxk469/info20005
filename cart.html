<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - HereBags</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="checkout-header">

    <h1 class="checkout-logo">HereBags</h1>

    <nav class="checkout-nav">
        <a href="website.html">Home</a>
        <a href="shop.html">Continue Shopping</a>
        <a href="cart.html">Checkout</a>
    </nav>
</header>

<div class="checkout-container">

    <!--Left side-->

    <div class="checkout-left">

        <div class="free-shipping-box">
            <h3>Free Shipping</h3>
            <p>You have qualified for free shipping!</p>
        </div>

        <h3 class="express-title">Express checkout</h3>

        <div class="express-checkout">
            <button class="shop-pay-btn">shop</button>
            <button class="paypal-express-btn">PayPal</button>
            <button class="gpay-btn">G Pay</button>
        </div>

        <div class="or-line">
            <span></span>
            <p>OR</p>
            <span></span>
        </div>

        <h2>Contact</h2>

        <input id ="email" type="email" placeholder="Email">

        <h2>Delivery</h2>

        <select>
            <option>Australia</option>
        </select>

        <div class="two-column">
            <input id="first-name" placeholder="First Name">
            <input id="last-name" placeholder="Last Name">
        </div>

        <input id="address" placeholder="Address">

        <div class="two-column">
            <input id="city" placeholder="City">
            <input id="postcode" placeholder="Postcode">
        </div>

        <input id="phone" placeholder="Phone">

        <h2>Payment</h2>

        <div class="payment-card">

            <label class="payment-title">
                <span>
                    <input type="radio" name="payment" checked>
                Credit Card
                </span>

                <span class="card-logos">
                    
                    <img src="https://www.thehorse.com.au/cdn/shopifycloud/checkout-web/assets/c1/assets/visa.sxIq5Dot.svg" alt="Visa">

                    <img src="https://www.thehorse.com.au/cdn/shopifycloud/checkout-web/assets/c1/assets/mastercard.1c4_lyMp.svg" alt="Mastercard">

                    <img src="https://www.thehorse.com.au/cdn/shopifycloud/checkout-web/assets/c1/assets/amex.Csr7hRoy.svg" alt="Amex">

                    <span class="extra-cards">+2</span>
                </span>
            </label>

            <input placeholder="Card Number">

            <div class="two-column">
                <input placeholder="MM / YY">
                <input placeholder="CVV">
            </div>

            <input placeholder="Name on Card">
        </div>

        <div class="paypal-option">
            <label>
                <input type="radio" name="payment">
                Paypal
            </label>
        </div>

        <div class="applepay-option">
            <label>
                <input type="radio" name="payment">
                Apple Pay
            </label>
        </div>

        <button class="pay-now-btn" onclick="checkout()">
            Pay Now
        </button>
</div>

<!--Right side-->

<div class="checkout-right">
    <h2>Order Summary</h2>
    <div id="cart-items"></div>

    <div class="discount-box">
        <input placeholder="Discount code">
        <button>Apply</button>
    </div>

    <div class="summary-row">
        <span>Shipping</span>
        <span>FREE</span>
    </div>

    <div class="summary-row total-row">
        <span>Total</span>
        <span id="cart-total">$0</span>
    </div>
</div>
</div>

<script src="script.js"></script>
    
</body>
</html>
