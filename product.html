<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product - HereBags</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1 class="logo">HereBags</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
    </nav>
 </header>
 
 <section class="product-page">

    <div class="thumbnail-column" id="thumbnail-column"></div>

    <div class="main-product-image">
        <button class="arrow left-arrow" onclick="previousProductImage()">Previous</button>

        <img id="main-product-image" src="" alt="Product image">

        <button class="arrow right-arrow" onclick="nextProductImage()">Next</button>
    </div>

    <div class="product-info">
        <h2 id="product-name"></h2>

        <p class="price" id="product-price"></p>

        <p id="product-description">Handmade luxury bag crafted with conscious design and premium materials.</p>

        <button id="add-product-button" class="add-cart-btn">Add to Cart</button>

        <div class="or-line">
            <span></span>
            <p>OR</p>
            <span></span>
        </div>

        <button class="apple-pay-btn" onclick="applePayCheckout()">Buy with  Pay</button>

        <button class="paypal-btn" onclick="paypalCheckout()">Buy with <strong>PayPal</strong></button>

        <a href="cart.html" class="more-payment">More payment options</a>
    </div>
 </section>

 <script src="script.js"></script>

</body>
</html>
